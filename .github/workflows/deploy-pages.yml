name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's#^APP_ENV=.*#APP_ENV=production#' .env
          sed -i 's#^APP_DEBUG=.*#APP_DEBUG=false#' .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          echo 'DB_DATABASE=database/database.sqlite' >> .env
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Laravel application key
        run: php artisan key:generate --force

      - name: Install static exporter
        run: composer require spatie/laravel-export:^1.5 --no-interaction --with-all-dependencies

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare portfolio database
        run: php artisan migrate:fresh --seed --force

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Laravel server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/laravel.log
              exit 1
            fi
            sleep 1
          done

      - name: Export complete static site
        run: |
          php artisan export
          find dist -type f \( -name '*.html' -o -name '*.xml' \) -print0 | xargs -0 sed -i \
            -e 's#href="/#href="/portfolio/#g' \
            -e 's#src="/#src="/portfolio/#g' \
            -e 's#action="/#action="/portfolio/#g' \
            -e 's#url(/#url(/portfolio/#g' \
            -e 's#http://127.0.0.1:8000#https://kleitonfr.github.io/portfolio#g'

      - name: Verify project pages were exported
        run: |
          test -f dist/index.html
          for slug in portal-lgpd360 mapeamento-lgpd estrategia-digital nest-florestal conversor-ret-excel vaga-facil; do
            test -f "dist/projetos/${slug}/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
